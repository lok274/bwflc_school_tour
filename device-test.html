<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <!-- Static-host compatible defence in depth; does not isolate same-origin apps. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' blob:; media-src blob:; font-src 'self'; connect-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta name="description" content="完整行程預演：正式景點及打卡拍照流程，模擬定位、獨立測試資料。" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./public/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./public/icons/app-icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=v110" />
    <title>正式流程預演 · 旅程測試頁</title>
  </head>
  <body class="rehearsal-body">
    <a class="skip-link" href="#app">跳到主要內容</a>

    <header class="app-header">
      <a class="brand" href="#itinerary" aria-label="返回測試行程">
        <span class="brand-mark" aria-hidden="true">測</span>
        <span>
          <strong>旅程預演</strong>
          <small>模擬定位 · 測試資料</small>
        </span>
      </a>
      <span id="network-status" class="network-pill" role="status">正在連線</span>
    </header>

    <p id="rehearsal-notice" class="test-notice rehearsal-notice">模擬位置 · 測試紀錄不作課業或出席證明</p>

    <main id="app" tabindex="-1">
      <section class="loading-state" aria-label="正在載入">
        <span class="loading-orbit" aria-hidden="true"></span>
        <p>正在整理旅程…</p>
      </section>
    </main>

    <details id="rehearsal-controls" class="rehearsal-controls" aria-labelledby="rehearsal-title">
      <summary id="rehearsal-title"><span aria-hidden="true">⚙️</span> 模擬定位與測試控制</summary>
      <div class="disclosure-content">
        <label for="rehearsal-scenario">模擬定位情境</label>
        <select id="rehearsal-scenario">
          <option value="within">在打卡範圍內</option><option value="too-far">距離太遠</option><option value="inaccurate">定位誤差太大</option><option value="denied">拒絕位置權限</option><option value="timeout">定位逾時</option>
        </select>
        <p class="privacy-note">測試資料不影響正式旅程。</p>
        <div class="photo-actions"><a class="text-link" href="./#home">返回正式網站 ↗</a><a class="text-link" href="./device-test.html?mode=diagnostics">定位與相機測試 ↗</a></div>
      </div>
    </details>

    <nav class="bottom-nav" aria-label="主要功能">
      <a href="#itinerary" data-nav="itinerary"><b>行程</b></a>
      <a href="#memories" data-nav="memories"><b>旅途回憶</b></a>
    </nav>

    <dialog id="camera-dialog" class="camera-dialog" closedby="closerequest" aria-labelledby="camera-title">
      <form method="dialog" class="dialog-shell camera-shell">
        <div class="dialog-heading">
          <div>
            <h2 id="camera-title">拍攝紀念照</h2>
          </div>
          <button class="icon-button" value="cancel" data-camera-close aria-label="關閉相機">×</button>
        </div>
        <div class="camera-stage">
          <video id="camera-video" autoplay muted playsinline aria-label="相機預覽"></video>
          <img id="camera-preview" alt="剛拍攝的紀念照預覽" hidden />
          <canvas id="camera-canvas" hidden></canvas>
          <div id="camera-loading" class="camera-loading">正在啟動相機…</div>
        </div>
        <p class="privacy-note">相片只存在這部裝置，不會上傳；關閉或離頁後相機停止。</p>
        <div class="dialog-actions camera-actions">
          <button type="button" class="button button-secondary" data-camera-retake hidden>重拍</button>
          <button type="button" class="shutter-button" data-camera-capture aria-label="拍攝照片"><span></span></button>
          <button type="button" class="button button-primary" data-camera-save hidden>使用照片</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog" class="confirm-dialog" closedby="closerequest" aria-labelledby="confirm-title">
      <form method="dialog" class="dialog-shell">
        <h2 id="confirm-title">請確認</h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">取消</button>
          <button id="confirm-button" class="button button-primary" value="confirm">確認</button>
        </div>
      </form>
    </dialog>

    <dialog id="memory-dialog" class="memory-dialog" aria-labelledby="memory-title" closedby="closerequest">
      <div id="memory-content" class="memory-dialog-content"></div>
    </dialog>

    <dialog id="photo-export-dialog" class="photo-export-dialog" aria-labelledby="photo-export-title" closedby="closerequest">
      <div class="dialog-shell">
        <div class="dialog-heading"><h2 id="photo-export-title">儲存相片到手機</h2><button class="icon-button" data-photo-export-close aria-label="關閉相片匯出">×</button></div>
        <div id="photo-export-content"></div>
      </div>
    </dialog>

    <input id="native-camera-input" type="file" accept="image/*" capture="environment" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <noscript>這個旅程助手需要 JavaScript 才能使用打卡及離線功能。</noscript>
    <script type="module" src="./src/device-lab.js?v=v110"></script>
  </body>
</html>
