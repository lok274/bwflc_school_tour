<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' blob:; media-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="../../styles.css" />
    <title>相機轉向版面驗證</title>
  </head>
  <body>
    <main class="page-shell">
      <h1>相機轉向版面驗證</h1>
      <p>使用正式 HTML 相機視窗及共用模組，影像由 Canvas 生成，不要求相機權限或改動儲存。</p>
      <p id="test-summary">正在準備…</p>
      <button id="open-fixture" class="button button-primary" disabled>開啟合成相機</button>
      <p id="save-result"></p>
    </main>
    <template id="app-fixture">
<dialog id="camera-dialog" class="camera-dialog" closedby="closerequest" aria-labelledby="camera-title">
      <form method="dialog" class="dialog-shell camera-shell">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">本機相機</p>
            <h2 id="camera-title">拍攝紀念照</h2>
          </div>
          <button class="icon-button" value="cancel" data-camera-close aria-label="關閉相機">×</button>
        </div>
        <div class="camera-stage">
          <video id="camera-video" autoplay muted playsinline aria-label="相機預覽"></video>
          <img id="camera-preview" alt="剛拍攝的紀念照預覽" hidden />
          <canvas id="camera-canvas" hidden></canvas>
          <div id="camera-loading" class="camera-loading">正在啟動相機…</div>
        </div>
        <p class="privacy-note">相機只在這個畫面運作；離開後會立即停止。照片經壓縮及移除位置資料後才儲存在此裝置。</p>
        <div class="dialog-actions camera-actions">
          <button type="button" class="button button-secondary" data-camera-retake hidden>重拍</button>
          <button type="button" class="shutter-button" data-camera-capture aria-label="拍攝照片"><span></span></button>
          <button type="button" class="button button-primary" data-camera-save hidden>使用照片</button>
        </div>
      </form>
    </dialog>
<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden />
<input id="native-camera-input" type="file" accept="image/*" capture="environment" hidden />
    </template>
    <template id="device-fixture">
<dialog id="camera-dialog" class="camera-dialog" closedby="closerequest" aria-labelledby="camera-title">
      <form method="dialog" class="dialog-shell camera-shell">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">本機相機</p>
            <h2 id="camera-title">拍攝紀念照</h2>
          </div>
          <button class="icon-button" value="cancel" data-camera-close aria-label="關閉相機">×</button>
        </div>
        <div class="camera-stage">
          <video id="camera-video" autoplay muted playsinline aria-label="相機預覽"></video>
          <img id="camera-preview" alt="剛拍攝的紀念照預覽" hidden />
          <canvas id="camera-canvas" hidden></canvas>
          <div id="camera-loading" class="camera-loading">正在啟動相機…</div>
        </div>
        <p class="privacy-note">相機只在這個畫面運作；離開後會立即停止。照片經壓縮及移除位置資料後才儲存在此裝置。</p>
        <div class="dialog-actions camera-actions">
          <button type="button" class="button button-secondary" data-camera-retake hidden>重拍</button>
          <button type="button" class="shutter-button" data-camera-capture aria-label="拍攝照片"><span></span></button>
          <button type="button" class="button button-primary" data-camera-save hidden>使用照片</button>
        </div>
      </form>
    </dialog>
<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden />
<input id="native-camera-input" type="file" accept="image/*" capture="environment" hidden />
    </template>
    <script type="module" src="./camera-orientation.js"></script>
  </body>
</html>
